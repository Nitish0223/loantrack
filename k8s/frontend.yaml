apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: loantrack
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: loantrack
spec:
  # The only Service exposed outside the cluster.
  # Open it with: minikube service frontend -n loantrack --url
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: loantrack
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: loantrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: loantrack
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # the "nginx" user from nginx-unprivileged
        runAsGroup: 101
      containers:
        - name: frontend
          image: loantrack-frontend:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: loantrack-config
                  key: BACKEND_HOST
            - name: BACKEND_PORT
              valueFrom:
                configMapKeyRef:
                  name: loantrack-config
                  key: BACKEND_PORT
          # Both probes hit nginx's own /healthz: the frontend is healthy when
          # nginx serves. It must not depend on the backend, otherwise an API
          # outage would also take the static page down.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # Liveness tolerates ~60s of no answer before restarting (see backend.yaml).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

# EXAMPLE ONLY: dummy values, committed so reviewers can see the shape.
# It is deliberately NOT listed in kustomization.yaml and is never applied.
#
# Create the real Secret from your git-ignored .env instead (idempotent):
#   kubectl create secret generic loantrack-db-secret -n loantrack \
#     --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -
# scripts/deploy.sh runs exactly this.
#
# Or copy this file to k8s/secret.yaml (git-ignored), set real values, and
#   kubectl apply -f k8s/secret.yaml
#
# Note: Secret values are only base64-encoded in etcd, not encrypted.
apiVersion: v1
kind: Secret
metadata:
  name: loantrack-db-secret
  namespace: loantrack
  labels:
    app.kubernetes.io/part-of: loantrack
type: Opaque
# stringData takes plain text; Kubernetes base64-encodes it into .data.
stringData:
  POSTGRES_USER: loantrack
  POSTGRES_PASSWORD: change-me-dummy-value
